[project]
name = "worker-case-tracker"
version = "0.1.0"
description = "Django Unfold tabanli isci dosyasi ve hukuki surec takip paneli"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "django-unfold>=0.101,<0.102",
    "gunicorn>=23.0,<24",
    "whitenoise>=6.9,<7",
    "psycopg[binary]>=3.2,<4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]

